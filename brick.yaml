name: mbkh_feat
description: Add a MBKH feature module (RepositoryUseCase, registerFeatureStack wiring, async providers).
repository: https://github.com/MahmoodBakhshayesh/brick-mbkh-feat

version: 0.2.2+1
vars:
  feature_name:
    type: string
    description: Feature name (snake_case)
    default: sample_feature
    prompt: What is the feature name?
  entity_name:
    type: string
    description: Primary entity name
    default: SampleItem
    prompt: What is the entity name?
  usecase_action:
    type: string
    description: Initial usecase action (verb)
    default: get
    prompt: What is the initial usecase action?
